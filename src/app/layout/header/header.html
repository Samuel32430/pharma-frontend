<header class="header">
  <button type="button" class="btn-menu" aria-label="Mostrar u ocultar menú" (click)="toggleMenu.emit()">☰</button>
  <a routerLink="/inicio" class="marca">PharmaSoft</a>
  <nav class="menubar">
    <a routerLink="/inicio">Inicio</a>
    <a href="http://localhost:8080/swagger-ui.html" target="_blank" rel="noopener">API</a>
  </nav>
  @if (auth.sesion(); as s) {
    <div class="usuario">
      <a routerLink="/mi-cuenta" class="nombre enlace-cuenta" title="Ir a Mi cuenta">{{ s.nombreCompleto }}</a>
      <span class="detalle">{{ s.roles.join(' · ') }} · expira a las {{ s.expiraEn | date: 'HH:mm' }} hrs</span>
    </div>
    <a routerLink="/mi-cuenta" class="btn-mi-cuenta" title="Mi cuenta">Mi cuenta</a>
    <button type="button" class="btn-salir" (click)="salir()">Cerrar sesión</button>
  }
</header>
